<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Flat League desktop design reference</title>
  <desc id="desc">Static visual reference for the proposed cinematic dark interface, cobalt and mint palette, floating arena illustration, and sample competition cards. All activity and amounts are illustrative. The final arena is specified for Three.js.</desc>
  <defs>
    <radialGradient id="atmosphere"><stop stop-color="#184E83" stop-opacity=".52"/><stop offset="1" stop-color="#080B12" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#476786"/><stop offset=".48" stop-color="#152D47"/><stop offset="1" stop-color="#080F1C"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#264D70"/><stop offset="1" stop-color="#101B2E"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#F4F7FC} .muted{fill:#A7B4C8} .small{font-size:14px} .meta{font-size:12px;letter-spacing:1.8px} .mono{font-family:"IBM Plex Mono",monospace} .mint{fill:#2DD4BF}
    </style>
  </defs>
  <rect width="1600" height="1160" fill="#05070C"/>
